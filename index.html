<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Manager</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Student Manager</h1>

      <div class="form">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="e.g. John Smith" />

        <label for="age">Age</label>
        <input type="number" id="age" placeholder="e.g. 21" />

        <label for="phone">Phone</label>
        <input type="tel" id="phone" placeholder="e.g. 317-555-1234" />

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="e.g. john@example.com" />

        <label for="classes">Classes</label>
        <input type="text" id="classes" placeholder="e.g. N215, N220, N322" />
        <span class="help-text">Separate multiple classes with commas</span>

        <div class="btn-group">
          <button id="addStudent" class="btn-primary">Add Student</button>
          <button id="displayStudents" class="btn-secondary">
            Display Students
          </button>
        </div>
      </div>

      <div class="students-section">
        <h2>Students</h2>
        <div id="studentList"></div>
      </div>
    </main>
    <script type="module" src="app/app.js"></script>
  </body>
</html>
